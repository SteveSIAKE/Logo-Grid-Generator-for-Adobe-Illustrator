<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Logo Grid Generator</title>
<link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="lgg-header">
    <h1>LOGO GRID GENERATOR <span class="lgg-version">v0.3.0</span></h1>
  </header>

  <main class="lgg-main">
    <section class="lgg-section">
      <label class="lgg-label" for="gridType">GRID TYPE</label>
      <select id="gridType" class="lgg-input">
        <option value="circular" selected>Circular Grid</option>
        <option value="modular">Modular Grid</option>
        <option value="square">Square Grid</option>
        <option value="radial">Radial Grid</option>
        <option value="golden">Golden Ratio</option>
        <option value="custom">Custom Grid</option>
      </select>
    </section>

    <section class="lgg-section">
      <h2>PARAMETERS</h2>
      <div id="params-circular">
        <div class="lgg-row">
          <label for="rings">Rings</label>
          <input id="rings" class="lgg-input" type="number" value="6" min="1" max="100" step="1" />
        </div>
      </div>
      <div class="lgg-row" id="row-spacing">
        <label for="spacing">Spacing</label>
        <input id="spacing" class="lgg-input" type="number" value="20" min="0" step="any" />
        <span class="lgg-unit">px</span>
      </div>
      <div id="params-grid" style="display:none">
        <div class="lgg-row">
          <label for="columns">Columns</label>
          <input id="columns" class="lgg-input" type="number" value="4" min="1" max="50" step="1" />
        </div>
        <div class="lgg-row">
          <label for="rows">Rows</label>
          <input id="rows" class="lgg-input" type="number" value="4" min="1" max="50" step="1" />
        </div>
      </div>
      <div id="params-modular" style="display:none">
        <div class="lgg-row">
          <label for="padding">Padding</label>
          <input id="padding" class="lgg-input" type="number" value="20" min="0" step="any" />
          <span class="lgg-unit">px</span>
        </div>
      </div>
      <div id="params-square" style="display:none">
        <div class="lgg-row">
          <label for="size">Cell size</label>
          <input id="size" class="lgg-input" type="number" value="40" min="0" step="any" />
          <span class="lgg-unit">px</span>
        </div>
      </div>
      <div id="params-radial" style="display:none">
        <div class="lgg-row">
          <label for="divisions">Divisions</label>
          <input id="divisions" class="lgg-input" type="number" value="12" min="1" max="360" step="1" />
        </div>
        <div class="lgg-row">
          <label for="radius">Radius</label>
          <input id="radius" class="lgg-input" type="number" value="0" min="0" step="any" title="0 = auto (base radius)" />
          <span class="lgg-unit">px</span>
        </div>
      </div>
      <div id="params-rotation" style="display:none">
        <div class="lgg-row">
          <label for="rotation">Rotation</label>
          <input id="rotation" class="lgg-input" type="number" value="0" step="any" />
          <span class="lgg-unit">°</span>
        </div>
      </div>
      <div id="params-golden" style="display:none">
        <div class="lgg-row">
          <label for="base">Base</label>
          <input id="base" class="lgg-input" type="number" value="0" min="0" step="any" title="0 = auto (half of smallest side)" />
          <span class="lgg-unit">px</span>
        </div>
        <div class="lgg-row">
          <label for="levels">Levels</label>
          <input id="levels" class="lgg-input" type="number" value="5" min="1" max="10" step="1" />
        </div>
      </div>
      <div id="params-custom" style="display:none">
        <div class="lgg-row">
          <label for="gwidth">Width</label>
          <input id="gwidth" class="lgg-input" type="number" value="240" min="0" step="any" />
          <span class="lgg-unit">px</span>
        </div>
        <div class="lgg-row">
          <label for="gheight">Height</label>
          <input id="gheight" class="lgg-input" type="number" value="120" min="0" step="any" />
          <span class="lgg-unit">px</span>
        </div>
        <div class="lgg-row">
          <label for="spacingV">V spacing</label>
          <input id="spacingV" class="lgg-input" type="number" value="10" min="0" step="any" />
          <span class="lgg-unit">px</span>
        </div>
        <div class="lgg-row">
          <label for="offX">Offset X</label>
          <input id="offX" class="lgg-input" type="number" value="0" step="any" />
          <span class="lgg-unit">px</span>
        </div>
        <div class="lgg-row">
          <label for="offY">Offset Y</label>
          <input id="offY" class="lgg-input" type="number" value="0" step="any" />
          <span class="lgg-unit">px</span>
        </div>
      </div>
      <h2>STYLE</h2>
      <div class="lgg-row">
        <label for="stroke">Stroke</label>
        <input id="stroke" class="lgg-input" type="number" value="1" min="0" step="0.25" />
        <span class="lgg-unit">pt</span>
      </div>
      <div class="lgg-row">
        <label for="opacity">Opacity</label>
        <input id="opacity" class="lgg-input" type="number" value="40" min="0" max="100" step="1" />
        <span class="lgg-unit">%</span>
      </div>
      <div class="lgg-row">
        <label for="color">Color</label>
        <input id="color" class="lgg-input lgg-color" type="color" value="#000000" />
      </div>
    </section>

    <section class="lgg-section">
      <h2>PRESETS</h2>
      <div class="lgg-row">
        <select id="presetSelect" class="lgg-input"></select>
        <button id="btnDeletePreset" type="button" class="lgg-btn lgg-btn-small" title="Delete custom preset">DEL</button>
      </div>
      <div class="lgg-row">
        <input id="presetName" class="lgg-input" type="text" placeholder="My preset name" maxlength="60" />
        <button id="btnSavePreset" type="button" class="lgg-btn lgg-btn-small">SAVE</button>
      </div>
      <div class="lgg-row">
        <button id="btnExport" type="button" class="lgg-btn lgg-btn-small">EXPORT</button>
        <label class="lgg-btn lgg-btn-small lgg-file-label">IMPORT
          <input id="importFile" type="file" accept=".json,application/json" hidden />
        </label>
      </div>
    </section>

    <section class="lgg-section">
      <h2>OPTIONS</h2>
      <label class="lgg-radio"><input id="lockGrid" type="checkbox" /> Lock generated layer</label>
      <label class="lgg-radio"><input id="showCenter" type="checkbox" /> Include center marker</label>
      <label class="lgg-radio"><input id="showBounds" type="checkbox" /> Include bounding box</label>
      <label class="lgg-radio"><input id="preview" type="checkbox" /> Live preview (auto-regenerate)</label>
      <div class="lgg-row" id="row-combine">
        <label class="lgg-radio"><input id="combine" type="checkbox" /> + radial overlay</label>
        <input id="combineDiv" class="lgg-input" type="number" value="12" min="1" max="360" step="1" title="Overlay divisions" />
      </div>
    </section>

    <section class="lgg-section">
      <h2>MULTIPLE SELECTION</h2>
      <label class="lgg-radio"><input type="radio" name="selMode" value="global" checked /> One grid for entire selection</label>
      <label class="lgg-radio"><input type="radio" name="selMode" value="perObject" /> One grid per object</label>
    </section>

    <div id="status" class="lgg-status" role="status" aria-live="polite"></div>

    <section class="lgg-actions">
      <button id="btnGenerate" type="button" class="lgg-btn lgg-btn-primary">GENERATE GRID</button>
      <button id="btnRegenerate" type="button" class="lgg-btn">REGENERATE</button>
      <button id="btnClear" type="button" class="lgg-btn">CLEAR GRID</button>
    </section>
  </main>

  <!-- Official Adobe CSInterface.js must replace js/CSInterface.js from the CEP SDK. -->
  <script src="./js/CSInterface.js"></script>
  <script src="./js/geometry.js"></script>
  <script src="./js/presets.js"></script>
  <script src="./js/host-comm.js"></script>
  <script src="./js/main.js"></script>
</body>
</html>
